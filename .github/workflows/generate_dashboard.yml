name: 🔄 Generar Dashboard

on:
  schedule:
        # Domingo 23:41 UTC ("noche del domingo al lunes" en toda España) — hora y
    # minuto poco comunes a propósito: GitHub retrasa (a veces varias horas)
    # los cron en horas "redondas" como 0:00/4:00 por congestión — ya nos pasó
    # (ejecuciones reales entre las 4:28 y las 10:08 UTC en vez de a las 4:00).
    # Aun así GitHub no garantiza el minuto exacto; si hace falta con certeza
    # antes de una hora concreta, lánzalo a mano (workflow_dispatch).
    - cron: '41 23 * * 0'
  workflow_dispatch:        # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

# Solo un despliegue a la vez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard HTML
        env:
          DATABRICKS_HOST:        ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH:   ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN:       ${{ secrets.DATABRICKS_TOKEN }}
        run: python gen_dashboard.py

      # fleet_history_frozen.json is gen_dashboard.py's own output (freeze_weekly_
      # history()) — a week's rows only land here once, the first time that week is
      # no longer "current". Committing it back keeps every future run's history
      # stable even if the grouping Sheet changes later. No PAT needed: this is the
      # repo's own default token pushing to itself.
      - name: Commit frozen fleet history (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fleet_history_frozen.json
          if git diff --cached --quiet; then
            echo "No newly-closed weeks to freeze."
          else
            git commit -m "Freeze newly-closed week(s) in fleet history"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
